# Production deployment: FastAPI (behind Caddy) + Caddy serving the built React app.
# Caddy terminates HTTP/HTTPS, serves the static dashboard, and reverse-proxies /api -> api:8000.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# data/ and reports/ are git-ignored and produced by the offline pipeline; they are
# shipped to the server and mounted in as volumes (the slim image does not embed them).
services:
  api:
    build: .
    command: uvicorn src.serve.api:app --host 0.0.0.0 --port 8000
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    expose:
      - "8000"
    restart: unless-stopped

  caddy:
    image: caddy:2
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
